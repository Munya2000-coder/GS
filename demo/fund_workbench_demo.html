*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{padding:14px 22px;background:linear-gradient(90deg,#10243f,#0f1419);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
header h1{font-size:16px;margin:0;font-weight:600}
header .fund{color:var(--mut);font-size:13px}
header .badge{margin-left:auto;font-size:12px;color:var(--mut)}

nav button:hover{color:var(--txt);background:var(--panel2)}
nav button.active{color:#fff;background:var(--acc);border-color:var(--acc)}
.wrap{padding:18px 22px;max-width:1280px;margin:0 auto}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.field{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;background:var(--panel2);transition:.12s}
.field:hover{border-color:var(--acc)}
.field.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.field .lbl{color:var(--mut);font-size:12px}
.field .val{font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.green{background:var(--green)}.amber{background:var(--amber)}.red{background:var(--red)}
.pill{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--mut)}
.pill.g{color:#7ee2a8;border-color:#1f6f3a}.pill.a{color:#f0c674;border-color:#7a5a12}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
tr.hi td{background:#16202c}
.src{background:#0c1117;border:1px solid var(--line);border-radius:8px;padding:14px;min-height:120px;font-size:13.5px;line-height:1.7}
.src .ref{color:var(--acc);font-weight:600;margin-bottom:6px}
.src mark{background:#3a2f0a;color:#f5e6b8;padding:1px 2px;border-radius:3px}
.muted{color:var(--mut)}
.sev-high{color:#ff7b72;font-weight:600}.sev-medium{color:#f0c674}.sev-low{color:#8b97a7}
.tag{font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--mut)}
.hint{font-size:12px;color:var(--mut);margin:0 0 12px}
code{background:#0c1117;padding:1px 5px;border-radius:4px;font-size:12px}
pre{background:#0c1117;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-size:12px;max-height:560px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 14px;min-width:120px}
.kpi b{display:block;font-size:22px}.kpi span{color:var(--mut);font-size:12px}
</style></head>

const P = DATA.pack, BP = DATA.blueprint;
document.getElementById('fundname').textContent = P.fund_name + '  ('+P.fund_id+')';
const tabs = ['Blueprint','Fund Terms','Operating Rules','Reporting Matrix','Investor Matrix','Calendar','Exceptions'];
let active = 'Blueprint';
const nav = document.getElementById('tabs');
tabs.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{active=t;render()};nav.appendChild(b)});
const lightClass = s => s==='green_confirmed'?'green':(s==='amber_review'?'amber':'red');
const pillClass = s => s==='green_confirmed'?'g':'a';
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function sourcePanel(cit, extra){
  if(!cit) return '<div class="src muted">No citation.</div>';
  let txt = esc(cit.exact_extracted_text||'');
  return '<div class="src"><div class="ref">'+esc(cit.clause_reference||cit.source_reference||'')+' · Page '+esc(cit.page_number||'?')+'</div><mark>'+txt+'</mark>'+(extra||'')+'</div>';
}

function blueprint(){
  const groups = [['fund_metadata','Fund Metadata'],['waterfall_rules','Waterfall Mechanics'],['fee_economics','Fee Economics']];
  let left='';
  groups.forEach(([k,title])=>{
    left += '<div class="card"><h3>'+title+'</h3>';
    Object.entries(BP[k]).forEach(([fk,f])=>{
      const id=k+'.'+fk;
      left += '<div class="field" data-cit=\''+encodeURIComponent(JSON.stringify(f.citation||{}))+'\' onclick="trace(this)">'+
        '<div><div class="lbl">'+fk.replace(/_/g," ")+'</div><div class="val">'+esc(f.value)+'</div></div>'+
        '<div style="text-align:right"><span class="dot '+lightClass(f.status)+'"></span><span class="pill '+pillClass(f.status)+'">'+Math.round(f.confidence*100)+'%</span></div>'+
        '</div>';
    });
    left += '</div>';
  });
  let ov='';
  (BP.side_letter_overrides||[]).forEach(o=>{ ov+='<div class="field" data-cit=\''+encodeURIComponent(JSON.stringify(o.citation||{}))+'\' onclick="trace(this)"><div><div class="lbl">override · investor '+esc(o.investor_id)+'</div><div class="val">'+esc(o.override_type)+' '+esc(o.override_value||'')+'</div></div><span class="pill a">review</span></div>'; });
  if(ov) left='<div class="card"><h3>⚠ Side-Letter Overrides</h3>'+ov+'</div>'+left;
  return '<p class="hint">Click any extracted value on the left → its <b>verbatim source clause</b> appears on the right (the "citation is the product" click-to-trace).</p>'+
    '<div class="split"><div>'+left+'</div><div><div class="card" style="position:sticky;top:10px"><h3>Source Evidence</h3><div id="srcpane"><div class="src muted">Select a field to trace it to source.</div></div></div></div></div>';
}
function fundTerms(){
  let r='<table><tr><th>Field</th><th>Value</th><th>Source</th><th>Conf</th><th>Status</th></tr>';
  P.fund_terms_summary.forEach(t=>{r+='<tr><td>'+esc(t.field)+'</td><td><b>'+esc(t.value)+'</b></td><td class="muted">'+esc(t.source_reference||'')+'</td><td>'+(t.confidence?Math.round(t.confidence*100)+'%':'')+'</td><td><span class="dot '+lightClass(t.status)+'"></span>'+esc(t.status||'').replace('_',' ')+'</td></tr>';});
  return '<div class="card"><h3>Fund Terms Summary</h3>'+r+'</table></div>';
}
function rules(){
  let r='';
  P.operating_rules.forEach(x=>{
    r+='<div class="card"><div style="display:flex;justify-content:space-between"><b>'+esc(x.rule_type)+'</b><span class="tag">'+esc(x.rule_id)+' · '+esc(x.rule_status)+'</span></div>'+
       '<div class="muted" style="margin:6px 0">'+esc(x.plain_english_summary||'')+'</div>'+
       '<div style="font-size:12px" class="muted">Source: '+esc(x.source_reference||'?')+' · confidence '+Math.round(x.confidence_score*100)+'%'+(x.requires_human_review?' · <span class="sev-medium">review</span>':'')+'</div>'+
       (x.evidence_required&&x.evidence_required.length?'<div style="margin-top:6px">'+x.evidence_required.map(e=>'<span class="tag">'+esc(e)+'</span>').join(' ')+'</div>':'')+
       '</div>';
  });
  return '<p class="hint">Portable Fund Operating Rules — each with a plain-English summary, evidence requirements, and source citation.</p>'+r;
}
function matrix(rows, cols){
  if(!rows.length) return '<div class="card muted">No rows.</div>';
  let r='<table><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr>';
  rows.forEach(x=>{r+='<tr'+(x.investor_specific?' class="hi"':'')+'>'+cols.map(c=>{let v=x[c[0]];if(typeof v==='boolean')v=v?'✓':'—';return '<td>'+esc(v)+'</td>';}).join('')+'</tr>';});
  return '<div class="card">'+r+'</table></div>';
}
function exceptions(){
  let r='<table><tr><th>Severity</th><th>Kind</th><th>Subject</th><th>Explanation</th><th>Action</th></tr>';
  P.exception_report.forEach(x=>{r+='<tr><td class="sev-'+esc(x.severity)+'">'+esc(x.severity).toUpperCase()+'</td><td><span class="tag">'+esc(x.kind)+'</span></td><td>'+esc(x.subject||'')+'</td><td>'+esc(x.explanation)+'</td><td class="muted">'+esc(x.action)+'</td></tr>';});
  return '<p class="hint">Missing required rules, side-letter overrides, and <b>PPM↔LPA consistency mismatches</b> — flagged for human review, not auto-resolved.</p><div class="card">'+r+'</table></div>';
}
window.trace=function(el){document.querySelectorAll('.field').forEach(f=>f.classList.remove('sel'));el.classList.add('sel');const cit=JSON.parse(decodeURIComponent(el.getAttribute('data-cit')));document.getElementById('srcpane').innerHTML=sourcePanel(cit);};
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.textContent===active));
  const v=document.getElementById('view');
  const k='<div class="kpis"><div class="kpi"><b>'+P.summary.documents+'</b><span>documents</span></div><div class="kpi"><b>'+P.summary.rules+'</b><span>rules</span></div><div class="kpi"><b>'+P.summary.open_exceptions+'</b><span>open exceptions</span></div><div class="kpi"><b>'+P.summary.high_severity_exceptions+'</b><span>high severity</span></div></div>';
  if(active==='Blueprint')v.innerHTML=k+blueprint();
  else if(active==='Fund Terms')v.innerHTML=k+fundTerms();
  else if(active==='Operating Rules')v.innerHTML=rules();
  else if(active==='Reporting Matrix')v.innerHTML=matrix(P.reporting_obligation_matrix,[['report','Report'],['frequency','Frequency'],['due_date','Due Date'],['recipient','Recipient'],['source','Source'],['owner','Owner'],['investor_specific','Investor-specific']]);
  else if(active==='Investor Matrix')v.innerHTML=matrix(P.investor_obligation_matrix,[['investor','Investor'],['commitment','Commitment'],['side_letter','Side Letter'],['custom_reporting','Custom Reporting'],['restriction','Restriction'],['tax_requirement','Tax'],['mfn','MFN'],['review_needed','Review']]);
  else if(active==='Calendar')v.innerHTML=matrix(P.obligation_calendar,[['timing','Timing'],['obligation','Obligation'],['source','Source'],['required_action','Required Action']]);
  else if(active==='Exceptions')v.innerHTML=exceptions();
}
render();
