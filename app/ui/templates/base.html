<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>{% block title %}GS Private Capital Suite{% endblock %}</title>
    <style>
      :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --err:#f85149; }
      * { box-sizing: border-box; }
      body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; }
      header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 24px; }
      header .brand { font-weight: 700; font-size: 16px; color: var(--accent); }
      header nav a { color: var(--text); margin-right: 16px; text-decoration: none; font-size: 14px; }
      header nav a:hover { color: var(--accent); }
      header .user { margin-left: auto; color: var(--muted); font-size: 13px; }
      main { max-width: 1200px; margin: 0 auto; padding: 24px; }
      h1 { font-size: 22px; margin: 0 0 16px; }
      h2 { font-size: 16px; margin: 24px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
      .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
      .kpi .value { font-size: 24px; font-weight: 600; margin-top: 4px; }
      .kpi .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
      table { width: 100%; border-collapse: collapse; margin-top: 8px; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
      th { color: var(--muted); font-weight: 500; }
      td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
      .badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
      .badge.ok { background: rgba(63,185,80,0.15); color: var(--ok); }
      .badge.warn { background: rgba(210,153,34,0.15); color: var(--warn); }
      .badge.err { background: rgba(248,81,73,0.15); color: var(--err); }
      .badge.muted { background: rgba(139,148,158,0.15); color: var(--muted); }
      a.row-link { color: var(--accent); text-decoration: none; }
      a.row-link:hover { text-decoration: underline; }
      form.inline { display: inline; }
      .btn { background: var(--accent); color: #0d1117; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
      input[type=text] { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 8px; border-radius: 4px; }
    </style>
</head>
<body>
<header>
    <span class="brand">GS Private Capital Suite</span>
    <nav>
        <a href="/ui/">Home</a>
        <a href="/ui/funds">Funds</a>
        <a href="/ui/investors">Investors</a>
        <a href="/ui/operations">Operations</a>
        <a href="/docs">API</a>
    </nav>
    <span class="user">
        {% if user %}{{ user.username }} ({{ user.roles | map(attribute='value') | join(',') }}) |
        <form class="inline" method="post" action="/ui/logout"><button class="btn" style="background:transparent;color:var(--muted);padding:0;">sign out</button></form>
        {% endif %}
    </span>
</header>
<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
